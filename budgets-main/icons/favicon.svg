<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f242d"/>
      <stop offset="100%" stop-color="#0f1217"/>
    </linearGradient>
    <linearGradient id="flowEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="flowCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Background -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)" stroke="#2d3748" stroke-width="6"/>

  <!-- Ambient Glow -->
  <circle cx="260" cy="256" r="140" fill="#10b981" opacity="0.16" filter="url(#glow)"/>

  <!-- Ribbon B & Flow Geometry -->
  <g filter="url(#glow)">
    <!-- Back loop (cyan gradient) -->
    <path d="M 220 120 C 310 120, 365 170, 365 240 C 365 295, 315 325, 255 330 C 325 340, 375 385, 375 450 C 375 510, 310 540, 220 540" 
          transform="scale(0.72) translate(85, 45)"
          fill="none" stroke="url(#flowCyan)" stroke-width="48" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Front loop and stem (emerald gradient) -->
    <path d="M 185 120 L 185 540" 
          transform="scale(0.72) translate(85, 45)"
          fill="none" stroke="url(#flowEmerald)" stroke-width="48" stroke-linecap="round"/>

    <!-- Interlocking ribbon curve -->
    <path d="M 185 330 C 235 330, 320 300, 320 240 C 320 180, 260 170, 185 170" 
          transform="scale(0.72) translate(85, 45)"
          fill="none" stroke="url(#flowEmerald)" stroke-width="44" stroke-linecap="round"/>

    <path d="M 185 490 C 265 490, 330 465, 330 400 C 330 350, 270 330, 185 330" 
          transform="scale(0.72) translate(85, 45)"
          fill="none" stroke="url(#flowCyan)" stroke-width="44" stroke-linecap="round"/>
  </g>
</svg>
