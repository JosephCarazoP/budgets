  <path d="M 176 296 H 284 C 342 296, 380 328, 380 376 C 380 422, 342 452, 284 452 H 176" 
        fill="none" stroke="url(#bfGradCyan)" stroke-width="48" stroke-linecap="round" stroke-linejoin="round"/>
